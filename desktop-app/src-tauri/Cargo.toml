[package]
name = "hcode-v2-desktop"
version = "2.0.0"
edition = "2021"

# NOTE: This crate is NOT compiled on CI — Cargo.lock is not committed.
# To build: cd desktop-app/src-tauri && cargo tauri dev
# See LAUNCH.md for prerequisites.

[dependencies]
tauri                       = { version = "2", features = [] }
tauri-plugin-dialog         = "2"
tauri-plugin-fs             = "2"
tauri-plugin-shell          = "2"
tauri-plugin-single-instance = "2"
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
tokio                       = { version = "1", features = ["full"] }
# keyring v3 has NO default credential store: without a platform-backend feature
# it silently uses a NON-PERSISTENT mock store, so set_password is a no-op and
# get_password returns NoEntry — tokens never reach the real OS credential
# manager. Enable the native backends per platform so save/read actually persist.
keyring                     = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "hcode-v2-desktop"
path = "src/main.rs"
