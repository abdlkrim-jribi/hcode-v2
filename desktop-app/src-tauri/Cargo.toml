[package]
name = "hcode-v2-desktop"
version = "2.0.0"
edition = "2021"

# NOTE: This crate is NOT compiled on CI — Cargo.lock is not committed.
# To build: cd desktop-app/src-tauri && cargo tauri dev
# See LAUNCH.md for prerequisites.

[dependencies]
tauri                       = { version = "2", features = [] }
tauri-plugin-dialog         = "2"
tauri-plugin-fs             = "2"
tauri-plugin-shell          = "2"
tauri-plugin-single-instance = "2"
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
tokio                       = { version = "1", features = ["full"] }
keyring                     = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "hcode-v2-desktop"
path = "src/main.rs"
