name: HCode v2 CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  deepagents:
    name: deepagents middleware tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/deepagents

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Run HCode v2 tests
        run: uv run --group test python -m pytest
          tests/unit_tests/middleware/test_pev_middleware.py
          tests/unit_tests/middleware/test_phase3_middleware.py
          tests/unit_tests/test_mcp.py
          tests/unit_tests/test_sqlite_checkpointer.py
          -v --tb=short

  shell:
    name: hcode_v2 shell tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run hcode_v2 shell tests
        run: uv run --group dev python -m pytest --cov=hcode_v2 --cov-report=term-missing

  windows-verification:
    name: Windows verification (pytest + keyless daemon probe + tsc)
    runs-on: windows-latest
    # This job exists because of a documented pattern: five separate features
    # (work_dir forwarding, skills forwarding, the native query correlator,
    # plan-review, the native desktop delivery pass) passed the two Ubuntu
    # jobs above and then failed for real, on Windows, against the actual
    # daemon/UI. See docs/verification.md. This job runs the suite on the
    # platform the app actually ships on, plus a raw-JSON-RPC probe against a
    # REAL daemon subprocess (keyless — see scripts/probe_daemon.py and
    # tests/helpers/scripted_model.py), plus the full TypeScript type-check
    # (a type error merged once because nothing here ran more than
    # `vite build`, which does not type-check on its own).

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run full pytest suite
        run: uv run --group dev python -m pytest tests/ -v --tb=short

      - name: Keyless probe — real daemon subprocess, scripted model, no API key
        run: uv run python scripts/probe_daemon.py --all

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop-app/src-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: desktop-app/src-ui
        run: npm ci

      - name: TypeScript type-check (tsc -b, not just vite build)
        working-directory: desktop-app/src-ui
        run: npx tsc -b
