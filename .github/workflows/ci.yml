name: HCode v2 CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  deepagents:
    name: deepagents middleware tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/deepagents

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Run HCode v2 tests
        run: uv run --group test python -m pytest
          tests/unit_tests/middleware/test_pev_middleware.py
          tests/unit_tests/middleware/test_phase3_middleware.py
          tests/unit_tests/test_mcp.py
          tests/unit_tests/test_sqlite_checkpointer.py
          -v --tb=short

  shell:
    name: hcode_v2 shell tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run hcode_v2 shell tests
        run: uv run --group dev python -m pytest --cov=hcode_v2 --cov-report=term-missing
