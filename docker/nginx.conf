# HCode v2 frontend — static SPA served by nginx.
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip the text assets (the Monaco bundle is large).
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime config and the HTML must never be cached — they carry the
    # per-environment WS URL injected at container start.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite emits content-hashed asset filenames — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown routes resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
