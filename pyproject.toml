[project]
name = "hcode-v2"
version = "2.0.0"
description = "HCode v2 — Autonomous AI coding CLI agent built on DeepAgents + LangGraph"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "click>=8.0",
    "rich>=13.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]

[project.scripts]
hcode = "hcode_v2.cli.main:cli"
hcode_v2 = "hcode_v2.cli.main:cli"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Vendored dependency pin.
# `deepagents` is NOT resolved from PyPI or a git ref — it is vendored as committed
# files under libs/deepagents/ and installed editable from this repo. Because the
# source tree is committed here, upstream cannot silently shift under us.
#   package : deepagents
#   version : 0.6.3  (upstream: github.com/langchain-ai/deepagents)
#   frozen  : hcode-v2 commit b57a6d2 — the last commit to touch libs/deepagents/
# To update intentionally: re-vendor the upstream tree, bump the version above,
# and record the new freeze commit here and in the README.
[tool.uv.sources]
deepagents = { path = "libs/deepagents", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
